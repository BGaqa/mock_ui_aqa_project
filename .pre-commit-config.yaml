repos:
  - repo: local
    hooks:
      - id: isort
        name: Run isort
        entry: isort .
        language: system
        types: [ python ]
        pass_filenames: false

      - id: black
        name: Run black
        entry: black .
        language: system
        types: [python]
        pass_filenames: false

      - id: flake8
        name: Run flake8
        entry: flake8 --config .flake8 .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: Run mypy
        entry: mypy .
        language: system
        types: [python]
        pass_filenames: false