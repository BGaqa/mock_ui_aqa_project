[tool.black]
line-length = 155
target-version = ["py311"]
exclude = '/(\.venv|venv|build|dist)/'

[tool.isort]
profile = "black"
line_length = 155
skip_glob = ["**/__init__.py"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = [
    "smoke: быстрый набор для базовой проверки health",
    "regression: расширенный набор, гоняем перед релизом",
    "db: тест ходит в БД (нужен доступ к dev-БД)",
    "slow: тест долгий, в smoke не включаем",
    "my_dev: моя техническая метка для запуска теста",
    "frontend: UI-тесты, запускаемые через Playwright",
]